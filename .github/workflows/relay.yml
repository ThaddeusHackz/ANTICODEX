name: relay

# The agent workspace can only reach npm/PyPI/GitHub, so this workflow does the
# fetching: a runner has open egress, so it reaches chatgpt.com, claude.ai, the
# vendors' CDNs and the Microsoft Store, measures the artifacts, and writes facts
# into relay/out/. No vendor binary or bundle is committed — only observations.
#
# Trigger: push a change to relay/trigger.txt, or dispatch manually.

on:
  push:
    paths:
      - 'relay/trigger.txt'
  workflow_dispatch:
    inputs:
      only:
        description: 'comma-separated stages: resolve,web,assets'
        required: false
        default: 'resolve,web'
      plan:
        description: 'inline JSON plan for the assets stage'
        required: false
        default: '[]'

permissions:
  contents: write

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: toolchain
        run: |
          node --version
          python3 --version
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full unzip file >/dev/null
          python3 -m pip install --quiet --break-system-packages pefile capstone
          python3 -c "import pefile, capstone; print('pefile', pefile.__version__, 'capstone', capstone.__version__)"

      - name: plan
        env:
          PLAN_INPUT: ${{ github.event.inputs.plan }}
        run: |
          mkdir -p relay/out
          if [ -n "$PLAN_INPUT" ] && [ "$PLAN_INPUT" != "[]" ]; then
            printf '%s' "$PLAN_INPUT" > relay/out/plan.json
          fi
          ls -l relay/out

      - name: collect
        env:
          RELAY_ONLY: ${{ github.event.inputs.only || 'resolve,web' }}
        run: node relay/collect.mjs 2>&1 | tee relay/out.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-out
          path: relay/out/
          retention-days: 14
          if-no-files-found: warn

      - name: publish facts to the branch
        if: always()
        run: |
          git config user.name 'relay'
          git config user.email 'relay@users.noreply.github.com'
          git add -f relay/out >/dev/null 2>&1 || true
          if git diff --cached --quiet; then echo 'nothing to publish'; exit 0; fi
          git commit -q -m "relay: collected facts [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME" || echo 'push refused — facts are in the artifact and the log'
