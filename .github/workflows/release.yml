name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build web bundle
        run: |
          cd web
          npm ci || npm install
          npm run build
      - name: Build ANTICODEX for Windows
        working-directory: desktop
        run: npm run package:win
      - name: Zip the app
        run: |
          cd release
          tar -a -c -f ANTICODEX-0.1.4-win32-x64.zip ANTICODEX-win32-x64
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/ANTICODEX-0.1.4-win32-x64.zip
          generate_release_notes: true
      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ANTICODEX-win32-x64
          path: release/ANTICODEX-0.1.4-win32-x64.zip

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install, build, test
        run: |
          cd web && npm ci || npm install && npm run build && cd ..
          node tests/test-api.mjs
          node tests/test-web.mjs
