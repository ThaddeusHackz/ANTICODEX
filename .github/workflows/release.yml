name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build web bundle
        run: |
          cd web
          npm ci || npm install
          npm run build
      - name: Build ANTICODEX for Windows
        working-directory: desktop
        run: npm run package:win
      # package-win.mjs already zips the app and names the file after the version
      # in desktop/package.json. Deriving the name here as well is how a release
      # ends up with no installable asset: the updater then tells every installed
      # app "an update is available" and has nothing to hand them.
      - name: Verify the asset matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (node -p "require('./desktop/package.json').version").Trim()
          if ("v$v" -ne $env:TAG) {
            Write-Error "tag $env:TAG does not match desktop/package.json version $v — installed apps would never see this release. Bump the version, tag it, then publish."
            exit 1
          }
          if (-not (Test-Path "release/ANTICODEX-$v-win32-x64.zip")) {
            Write-Error "release/ANTICODEX-$v-win32-x64.zip was not produced by package:win"
            exit 1
          }
        env:
          TAG: ${{ github.ref_name }}
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/ANTICODEX-*-win32-x64.zip
          generate_release_notes: true
      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ANTICODEX-win32-x64
          path: release/ANTICODEX-*-win32-x64.zip

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [api, auth, web-static, web-mount, desktop]
        # Two Node versions on purpose. Vercel runs 22; the packaged .exe embeds
        # Electron 31's Node, which is the 20 line — so `api/` + `lib/` have to work
        # on both, and a runner pinned to one silently stops testing the other.
        node: ['20', '22']
        exclude:
          # The mount harness needs jsdom, and jsdom@30 pulls undici@7, which throws
          # on Node 20 (`undici/lib/interceptor/decompress.js: Cannot read
          # properties of undefined (reading 'bind')`). That is a harness/toolchain
          # limit, not an app defect — no shipping runtime uses it for rendering — so
          # the renderer suite runs on 22 while every suite that touches the bridge
          # runs on both.
          - suite: web-mount
            node: '20'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps and build the bundle
        # --include=dev because the test harness needs devDependencies (esbuild,
        # jsdom). An install that honours NODE_ENV=production would leave the mount
        # suite unable to run at all, so it is pinned and then verified.
        run: |
          cd web
          (npm ci --include=dev || npm install --include=dev)
          npm run build
          node -e "for (const m of ['esbuild','jsdom','react']) require.resolve(m); console.log('test toolchain ok')"
      - name: Run ${{ matrix.suite }} suite (node ${{ matrix.node }})
        # fail-fast:false matters more than it looks: in one shared job the first red
        # suite skips the rest, so "which of the five broke?" costs another CI round
        # trip. A matrix runs them independently and the check name answers it.
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          case "$SUITE" in
            api) f=tests/test-api.mjs ;;
            auth) f=tests/test-auth.mjs ;;
            web-static) f=tests/test-web.mjs ;;
            web-mount) f=tests/test-web-mount.mjs ;;
            desktop) f=tests/test-desktop.mjs ;;
          esac
          set +e
          out=$(node "$f" 2>&1); rc=$?
          echo "$out" | tail -120
          # Actions' raw log endpoint is not always reachable (fork PRs, restricted
          # tokens, expired artifacts). Assertions print a stable "  ✗ name — detail"
          # line, so mirror those into check annotations: the failure is then
          # readable straight from the API, with no log download at all.
          if [ "$rc" -ne 0 ]; then
            echo "$out" | grep -E '^ *✗' | head -12 | while IFS= read -r line; do
              printf '::error::%s\n' "$(echo "$line" | sed 's/^ *//')"
            done
            echo "$out" | grep -E 'passed, [0-9]+ failed' | tail -1 | sed 's/^ */::error::/' || true
            printf '::error::%s exited %s — if no ✗ lines are listed above, the suite threw before asserting\n' "$f" "$rc"
            exit "$rc"
          fi
          # A suite that skips itself must never read as a pass.
          if echo "$out" | grep -q 'Skipping\.'; then
            printf '::error::%s skipped itself (missing dependencies?) — a skip is not a pass\n' "$f"
            exit 1
          fi
